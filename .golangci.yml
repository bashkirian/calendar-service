version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
  exclusions:
    generated: strict
    presets: [comments, std-error-handling]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/bashkirian/calendar-service]
